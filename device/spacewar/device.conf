# SPDX-License-Identifier: MIT
# Device descriptor: Nothing Phone (1) (spacewar).
#
# Same rules as device/cheetah/device.conf. No shell.
#
# Boot format (BOOT_METHOD=qcom-abl-v2): this ABL, unlike the OnePlus 13's
# (dodge, qcom-abl), boots a plain header-v2 boot image with the DTB appended
# to the kernel — exactly what postmarketOS flashes on this phone (its
# deviceinfo: header_version 2, pagesize 4096, base 0x0, kernel 0x8000,
# ramdisk 0x1000000, dtb 0x1f00000, tags 0x100, append_dtb). `omamobile
# images` packs it with the tree-local mkbootimg; no chain loader, no
# LIVE_DTB. Stock's dtbo_b is erased by install-phone and flash (its
# overlays target stock's DTB nodes, and this ABL would apply them onto the
# DTB our boot image carries), so it stays on the guard's allowlist but
# BOOT_IMAGES holds only boot. install-phone, flash and push take
# qcom-abl-v2 (push rewrites boot_b on sda, the day-2 path); omamobile-boot-
# update supports qcom-abl-v2 now (P4b t_29f8546d), so an install writes
# AUTO_WRITE=yes and the hook rebuilds + writes slot B's images on kernel
# updates. `omamobile fastboot` still refuses it: the panic path to the
# bootloader is uncharacterized on this ABL (buttons instead).

# --- Identity ---
CODENAME=spacewar
NAME="Nothing Phone (1)"
SOC=sm7325
# The DT root compatible; ath11k looks up board data by it.
COMPATIBLE="nothing,spacewar"
PACKAGE=omamobile-device-spacewar
# Board-specific userspace on top of the shared rootfs/packages.omamobile:
# the remote processors (modem, audio DSP, sensors DSP) and freedreno Vulkan
# (the GPU itself is mainline and covered by our mesa build). ModemManager
# comes from Arch Linux ARM, pulled in by the device package's depends
# (ROOTFS_PACKAGES must name only [omamobile] packages: build-rootfs
# installs that list from out/spacewar/repo alone); qrtr-ns, pd-mapper and
# hexagonrpcd (the Qualcomm remoteproc way, not the Pixels' modem-sit) from
# [omamobile]. The car apps (omamobile-chargeplanner, -fahrtenbuch,
# -parkreminder, -audiobookshelf) ship disabled: no timer or udev rule is
# enabled by the install (packages/omamobile-*/install).
# snaildrive-android-auto-phone: AA nav bridge + AOA gadget guard (lab stage, not enabled by
# the install; the auto profile starts it, see car-apps/carprofile).
ROOTFS_PACKAGES="hexagonrpcd qrtr pd-mapper vulkan-freedreno omamobile-chargeplanner omamobile-fahrtenbuch omamobile-parkreminder omamobile-audiobookshelf snaildrive-android-auto-phone"

# --- Kernel and device tree ---
# The board DTB, as built by kernel-spacewar/ (sc7280-mainline v7.2.2-sc7280
# + the 52 spacewar patches). Appended to the kernel image (BOOT_APPEND_DTB).
DTB=qcom/sm7325-nothing-spacewar.dtb
# The kernel's release is 7.2.2-sc7280-omamobile1, from the wrapper's
# kernel-spacewar build (kernel-spacewar/out), not the gs201 kernel.

# --- Bootloader glue ---
BOOT_METHOD=qcom-abl-v2
# The kernel command line in the boot image. ttyMSM0 is uart5, the debug
# console the DTS names as stdout-path; earlycon is the same QUP UART
# (0x994000). No SOC_IDS needed: the ABL takes the DTB from the image, and
# there is only one board.
# console=ttyMSM0 keeps kernel messages on the debug UART (earlycon). All
# other console output is suppressed when "splash" is on the cmdline: the
# shared initramfs/init hides the console and draws /splash.bgra.gz. quiet +
# loglevel=0 + vt.global_cursor_default=0 keep the on-screen console clean
# while booting. Debug is preserved on purpose: printk.devkmsg=on and panic=10
# stay in the kernel for post-mortem (dmesg / panic=10).
CMDLINE="console=ttyMSM0,115200n8 earlycon=qcom_geni,0x994000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on panic=10"
# Bring-up: keep boot messages visible. Once USB and the GUI work, add
# "quiet splash loglevel=0 vt.global_cursor_default=0" for the Omarchy splash
# (device/spacewar/splash/README.md).
BOOT_PAGESIZE=4096
BOOT_BASE=0x0
BOOT_KERNEL_OFFSET=0x8000
BOOT_RAMDISK_OFFSET=0x1000000
BOOT_DTB_OFFSET=0x1f00000
BOOT_TAGS_OFFSET=0x100
BOOT_APPEND_DTB=1

# --- Storage guard ---
# Slot B's boot image, dtbo_b (the installer erases stock's dtbo on slot B)
# and userdata. Nothing else: no init_boot/vendor_boot on this flow — the
# whole boot chain is the single boot image.
BOOT_IMAGES=boot
UFS_RW="boot_b dtbo_b vendor_boot_b userdata"
OMAMOBILE_SLOT=b

# --- Radio backup ---
# What tools/nv-backup copies, read-only, before any radio work (AGENTS.md
# section 1), found on the phone by PARTNAME. Same partition set as the
# Pixels: the modem's NV and calibration (IMEI, WiFi/BT board data) which
# nothing on Linux may change, plus modem_a/b (the modem's own firmware
# slots). NV_BACKUP_EXTRA is copied for a full way back but is expected to
# change: devinfo holds the bootloader's slot flags and unlock state.
# The P0 stock backup (before anything is installed) reads the same set;
# on stock Android the path is adb-root or a `fastboot boot` recovery, not
# phone-ssh — see device/spacewar/NOTES.md.
NV_PARTS="efs efs_backup modem_userdata persist modem_a modem_b"
NV_BACKUP_EXTRA="devinfo"

# --- Initramfs ---
# The shared init. The early modules postmarketOS loads in its initramfs
# (modules-initfs): the USB-C orientation switch, the display stack for the
# splash, the panel, the QUP SPI engine and touch. With the root on userdata
# (/dev/sda6) the guard finds it by PARTNAME like on the Pixels.
INITRAMFS_INIT=/initramfs/init
INITRAMFS_MODULES="qcom_common qcom_pil_info qcom_q6v5 qcom_q6v5_pas libcomposite u_ether usb_f_ncm u_serial usb_f_acm fsa4480 msm panel-visionox-rm692e5 spi-geni-qcom fts_tp"
# Portrait, for the early boot splash.
PANEL_SIZE=1080x2400
# Draw the early splash once /dev/fb0 exists (the panel/drm drivers are loaded
# by INITRAMFS_MODULES, after the shared init would draw at once): mirrors
# device/raven, which races simpledrm's fb0 otherwise.
INITRAMFS_FB_WAIT=1
