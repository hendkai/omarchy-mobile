# SPDX-License-Identifier: MIT
# Device descriptor: Nothing Phone (1) (spacewar).
#
# Same rules as device/cheetah/device.conf. No shell.
#
# Boot format (BOOT_METHOD=qcom-abl-v2): this ABL, unlike the OnePlus 13's
# (dodge, qcom-abl), boots a plain header-v2 boot image with the DTB appended
# to the kernel — exactly what postmarketOS flashes on this phone (its
# deviceinfo: header_version 2, pagesize 4096, base 0x0, kernel 0x8000,
# ramdisk 0x1000000, dtb 0x1f00000, tags 0x100, append_dtb). `omamobile
# images` packs it with the tree-local mkbootimg; no chain loader, no
# LIVE_DTB. Stock's dtbo_b is erased by the installer (its overlays target
# stock's DTB nodes), so it stays on the guard's allowlist but BOOT_IMAGES
# holds only boot. flash and push refuse qcom-abl-v2 until the day-2 path
# lands; install-phone is not wired up for it yet (P4).

# --- Identity ---
CODENAME=spacewar
NAME="Nothing Phone (1)"
SOC=sm7325
# The DT root compatible; ath11k looks up board data by it.
COMPATIBLE="qcom,sm7325-nothing-spacewar"
PACKAGE=omamobile-device-spacewar
# Board-specific userspace on top of the shared rootfs/packages.omamobile:
# the remote processors (modem, audio DSP, sensors DSP) and freedreno Vulkan
# (the GPU itself is mainline and covered by our mesa build). ModemManager
# comes from Arch Linux ARM; qrtr-ns, pd-mapper and hexagonrpcd (the
# Qualcomm remoteproc way, not the Pixels' modem-sit) from [omamobile].
ROOTFS_PACKAGES="hexagonrpcd qrtr pd-mapper modemmanager vulkan-freedreno"

# --- Kernel and device tree ---
# The board DTB, as built by kernel-spacewar/ (sc7280-mainline v7.2.2-sc7280
# + the 52 spacewar patches). Appended to the kernel image (BOOT_APPEND_DTB).
DTB=qcom/sm7325-nothing-spacewar.dtb
# The kernel's release is 7.2.2-sc7280-omamobile1, from the wrapper's
# kernel-spacewar build (kernel-spacewar/out), not the gs201 kernel.

# --- Bootloader glue ---
BOOT_METHOD=qcom-abl-v2
# The kernel command line in the boot image. ttyMSM0 is uart5, the debug
# console the DTS names as stdout-path; earlycon is the same QUP UART
# (0x994000). No SOC_IDS needed: the ABL takes the DTB from the image, and
# there is only one board.
CMDLINE="console=ttyMSM0,115200n8 earlycon=qcom_geni,0x994000 clk_ignore_unused pd_ignore_unused printk.devkmsg=on panic=10"
BOOT_PAGESIZE=4096
BOOT_BASE=0x0
BOOT_KERNEL_OFFSET=0x8000
BOOT_RAMDISK_OFFSET=0x1000000
BOOT_DTB_OFFSET=0x1f00000
BOOT_TAGS_OFFSET=0x100
BOOT_APPEND_DTB=1

# --- Storage guard ---
# Slot B's boot image, dtbo_b (the installer erases stock's dtbo on slot B)
# and userdata. Nothing else: no init_boot/vendor_boot on this flow — the
# whole boot chain is the single boot image.
BOOT_IMAGES=boot
UFS_RW="boot_b dtbo_b userdata"
OMAMOBILE_SLOT=b

# --- Initramfs ---
# The shared init. The early modules postmarketOS loads in its initramfs
# (modules-initfs): the USB-C orientation switch, the display stack for the
# splash, the panel, the QUP SPI engine and touch. With the root on userdata
# (/dev/sda6) the guard finds it by PARTNAME like on the Pixels.
INITRAMFS_INIT=/initramfs/init
INITRAMFS_MODULES="fsa4480 msm panel-visionox-rm692e5 spi-geni-qcom fts_tp"
# Portrait, for the early boot splash.
PANEL_SIZE=1080x2400
