# SPDX-License-Identifier: MIT
# Paket omamobile-chargeplanner: EV-Ladeplaner (BNetzA-Register, offline).
# Das Ladesaeulenregister (CSV) ist NICHT im Paket; REGISTER_URL setzt die
# Quelle, der Timer holt es monatlich.
# Konfiguration: /etc/chargeplanner.conf (Paket-Default), Override in
# ~/.config/chargeplanner.conf. KEINE Zugangsdaten hier eintragen.
# HINWEIS: REGISTER_URL ist eine datierte Datei (BNetzA-Ladesaeulenregister).
# Sie muss bei jedem BNetzA-Update auf die neue Datei umgebogen werden
# (aktuelle Liste: https://bundesnetzagentur.de/E-Mobilitaet/Ladesaeulenkarte).
# Ein veralteter Link lässt den Timer still aufhören, das Register zu
# aktualisieren: --refresh-register beendet nur mit Fehler, wenn der Download
# fehlschlägt UND das lokale Register aelter als MAX_AGE_DAYS ist (s. test).
REGISTER_URL=https://data.bundesnetzagentur.de/Bundesnetzagentur/DE/Fachthemen/ElektrizitaetundGas/E-Mobilitaet/Ladesaeulenregister_BNetzA_2026-09-01.csv

# SoC-Quelle: manual (--soc PROZENT) | mercedes (Statusdatei des
# omarchy-mercedes-Connectors, read-only; --soc bleibt Fallback).
SOC_SOURCE=manual
# Nur fuer SOC_SOURCE=mercedes. Der Connector schreibt diese Datei im
# Benutzerkontext; der Pfad ist eine Angabe, kein Geheimnis.
#MERCEDES_STATUS_CACHE=~/.local/state/omarchy-mercedes/status.json
