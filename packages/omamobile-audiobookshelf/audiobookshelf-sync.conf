# /etc/audiobookshelf-sync.conf: Vorlage (Paketdefault). Werte, die Hendrik
# setzt, stehen NICHT hier: Host, Schluessel und Bibliotheks-ID bleiben lokal.
# Format KEY=VALUE, keine Shell.
UNRAID_HOST=
UNRAID_KEY=/etc/audiobookshelf-sync/id_ed25519
SRC=
DEST=/var/lib/audiobookshelf-sync/audiobooks/
STATE=/var/lib/audiobookshelf-sync/last_sync
BWLIMIT=8000
MIN_FREE_GB=2
ABS_URL=
ABS_LIBRARY_ID=
